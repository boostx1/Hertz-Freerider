<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Hertz Freerider Route Search</title>
</head>
<body>
    <h1>Find routes</h1>

    <form method="post">
        <label>Pickup location:</label><br />
        <input type="text" name="start_place" required /><br /><br />

        <label>Destination:</label><br />
        <input type="text" name="end_place" required /><br /><br />

        <button type="submit">Find routes</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if routes %}
        <h2>Available routes</h2>
        <ul>
        {% for route in routes %}
            <li>{{ route | join(" → ") }}</li>
        {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
